name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g., 0.8.6)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-cask:
    name: Update Cask Formula
    runs-on: macos-14
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Get target version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            REQ="${{ github.event.inputs.version }}"
            # Resolve the real tag: a release may be tagged "v0.15.0" or bare "0.15.0".
            TAG=""
            for cand in "$REQ" "v${REQ#v}" "${REQ#v}"; do
              if curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/zosmaai/zosma-cowork/releases/tags/${cand}" >/dev/null 2>&1; then
                TAG="$cand"; break
              fi
            done
            [ -z "$TAG" ] && TAG="v${REQ#v}"
          else
            # Use the latest release's tag verbatim (do NOT strip the leading v here).
            TAG=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" "https://api.github.com/repos/zosmaai/zosma-cowork/releases/latest" | \
              python3 -c "import json,sys;print(json.load(sys.stdin).get('tag_name',''))" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "Failed to fetch latest release"
              exit 1
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

      - name: Check current cask version
        id: current
        run: |
          CURRENT=$(grep -E "^  version" Casks/zosma-cowork.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current cask version: $CURRENT"

      - name: Skip if same version
        if: steps.version.outputs.value == steps.current.outputs.value && github.event_name != 'workflow_dispatch'
        run: |
          echo "Cask is already at version ${{ steps.version.outputs.value }}. Nothing to update."
          exit 0

      - name: Find and download DMG assets
        id: dmg
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/zosmaai/zosma-cowork/releases/tags/${TAG}")
          echo "API keys: $(echo "$ASSETS_JSON" | python3 -c "import json,sys;print(list(json.load(sys.stdin).keys()))" 2>/dev/null || echo 'parse_failed')"

          # pick <python-predicate-on-n> -> prints "<name>\t<browser_download_url>" for
          # the first matching .dmg asset, or empty. Using the API-provided
          # browser_download_url means we never have to guess the tag/url shape.
          pick() {
            echo "$ASSETS_JSON" | python3 -c "import json,sys; a=json.load(sys.stdin).get('assets',[]); m=[x for x in a for n in [x['name']] if n.endswith('.dmg') and ($1)]; print(m[0]['name']+'\t'+m[0]['browser_download_url'] if m else '')"
          }

          # First check for universal DMG (single build for Apple Silicon + Intel)
          UNIVERSAL=$(pick '"universal" in n')
          if [ -n "$UNIVERSAL" ]; then
            NAME="${UNIVERSAL%%$'\t'*}"; URL="${UNIVERSAL#*$'\t'}"
            echo "Found universal DMG: $NAME (single build for Apple Silicon + Intel)"
            echo "arm_dmg=$NAME" >> "$GITHUB_OUTPUT"
            curl -sL -o zosma-cowork-universal.dmg "$URL"
            SHA256_UNIVERSAL=$(shasum -a 256 zosma-cowork-universal.dmg | cut -d ' ' -f 1)
            echo "arm_sha256=$SHA256_UNIVERSAL" >> "$GITHUB_OUTPUT"
            echo "Universal SHA256: $SHA256_UNIVERSAL"
          else
            # Fall back to architecture-specific DMG detection (legacy releases)
            ARM=$(pick '"aarch64" in n or "arm64" in n')
            if [ -n "$ARM" ]; then
              NAME="${ARM%%$'\t'*}"; URL="${ARM#*$'\t'}"
              echo "arm_dmg=$NAME" >> "$GITHUB_OUTPUT"
              echo "Downloading ARM DMG: $NAME"
              curl -sL -o zosma-cowork-arm64.dmg "$URL"
              SHA256_ARM=$(shasum -a 256 zosma-cowork-arm64.dmg | cut -d ' ' -f 1)
              echo "arm_sha256=$SHA256_ARM" >> "$GITHUB_OUTPUT"
              echo "ARM SHA256: $SHA256_ARM"
            else
              echo "No ARM DMG found in release ${TAG}"
            fi

            INTEL=$(pick '"x64" in n or "amd64" in n or "intel" in n.lower()')
            if [ -n "$INTEL" ]; then
              NAME="${INTEL%%$'\t'*}"; URL="${INTEL#*$'\t'}"
              echo "intel_dmg=$NAME" >> "$GITHUB_OUTPUT"
              echo "Downloading Intel DMG: $NAME"
              curl -sL -o zosma-cowork-x64.dmg "$URL"
              SHA256_INTEL=$(shasum -a 256 zosma-cowork-x64.dmg | cut -d ' ' -f 1)
              echo "intel_sha256=$SHA256_INTEL" >> "$GITHUB_OUTPUT"
              echo "Intel SHA256: $SHA256_INTEL"
            else
              echo "No Intel DMG found in release ${TAG}"
            fi
          fi

      - name: Abort if no DMG found
        if: steps.dmg.outputs.arm_dmg == '' && steps.dmg.outputs.intel_dmg == ''
        run: |
          echo "No DMG assets found in release v${{ steps.version.outputs.value }}. Aborting."
          exit 1

      - name: Update Cask formula
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ steps.version.outputs.tag }}
          ARM_DMG: ${{ steps.dmg.outputs.arm_dmg }}
          INTEL_DMG: ${{ steps.dmg.outputs.intel_dmg }}
          SHA256_ARM: ${{ steps.dmg.outputs.arm_sha256 }}
          SHA256_INTEL: ${{ steps.dmg.outputs.intel_sha256 }}
        run: |
          python3 .github/scripts/update-cask.py \
            "Casks/zosma-cowork.rb" \
            "$VERSION" \
            "$ARM_DMG" \
            "$INTEL_DMG" \
            "$SHA256_ARM" \
            "$SHA256_INTEL" \
            "$TAG"

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zosma-cowork.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump zosma-cowork to ${VERSION}"
          git push
