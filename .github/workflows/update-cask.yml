name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g., 0.8.6)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-cask:
    name: Update Cask Formula
    runs-on: macos-14
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Get target version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            TAG=$(curl -sL "https://api.github.com/repos/zosmaai/zosma-cowork/releases/latest" | \
              python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('tag_name','').lstrip('v'))" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "Failed to fetch latest release"
              exit 1
            fi
            echo "value=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check current cask version
        id: current
        run: |
          CURRENT=$(grep -E "^  version" Casks/zosma-cowork.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "value=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current cask version: $CURRENT"

      - name: Skip if same version
        if: steps.version.outputs.value == steps.current.outputs.value && github.event_name != 'workflow_dispatch'
        run: |
          echo "Cask is already at version ${{ steps.version.outputs.value }}. Nothing to update."
          exit 0

      - name: Find and download DMG assets
        id: dmg
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSETS_JSON=$(curl -sL -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/zosmaai/zosma-cowork/releases/tags/v${VERSION}")
          # Debug: show first API response key to verify auth worked
          echo "API keys: $(echo "$ASSETS_JSON" | python3 -c "import json,sys;print(list(json.load(sys.stdin).keys()))" 2>/dev/null || echo 'parse_failed')"
          PYCMD='import json,sys;a=json.load(sys.stdin).get("assets",[]);d=[n for n in [x["name"] for x in a] if n.endswith(".dmg")'

          # First check for universal DMG (single build for Apple Silicon + Intel)
          UNIVERSAL_DMG=$(echo "$ASSETS_JSON" | python3 -c "${PYCMD} and (\"universal\" in n)];print(d[0] if d else \"\")")

          if [ -n "$UNIVERSAL_DMG" ]; then
            echo "Found universal DMG: $UNIVERSAL_DMG (single build for Apple Silicon + Intel)"
            echo "arm_dmg=$UNIVERSAL_DMG" >> "$GITHUB_OUTPUT"

            echo "Downloading DMG: $UNIVERSAL_DMG"
            curl -sL -o zosma-cowork-universal.dmg \
              "https://github.com/zosmaai/zosma-cowork/releases/download/v${VERSION}/${UNIVERSAL_DMG}"
            SHA256_UNIVERSAL=$(shasum -a 256 zosma-cowork-universal.dmg | cut -d ' ' -f 1)
            echo "arm_sha256=$SHA256_UNIVERSAL" >> "$GITHUB_OUTPUT"
            echo "Universal SHA256: $SHA256_UNIVERSAL"
          else
            # Fall back to architecture-specific DMG detection (legacy releases)

            # Find ARM DMG
            ARM_DMG=$(echo "$ASSETS_JSON" | python3 -c "${PYCMD} and (\"aarch64\" in n or \"arm64\" in n)];print(d[0] if d else \"\")")
            echo "arm_dmg=$ARM_DMG" >> "$GITHUB_OUTPUT"

            if [ -n "$ARM_DMG" ]; then
              echo "Downloading ARM DMG: $ARM_DMG"
              curl -sL -o zosma-cowork-arm64.dmg \
                "https://github.com/zosmaai/zosma-cowork/releases/download/v${VERSION}/${ARM_DMG}"
              SHA256_ARM=$(shasum -a 256 zosma-cowork-arm64.dmg | cut -d ' ' -f 1)
              echo "arm_sha256=$SHA256_ARM" >> "$GITHUB_OUTPUT"
              echo "ARM SHA256: $SHA256_ARM"
            else
              echo "No ARM DMG found in release v${VERSION}"
            fi

            # Find Intel DMG
            INTEL_DMG=$(echo "$ASSETS_JSON" | python3 -c "${PYCMD} and (\"x64\" in n or \"amd64\" in n or \"intel\" in n.lower())];print(d[0] if d else \"\")")
            echo "intel_dmg=$INTEL_DMG" >> "$GITHUB_OUTPUT"

            if [ -n "$INTEL_DMG" ]; then
              echo "Downloading Intel DMG: $INTEL_DMG"
              curl -sL -o zosma-cowork-x64.dmg \
                "https://github.com/zosmaai/zosma-cowork/releases/download/v${VERSION}/${INTEL_DMG}"
              SHA256_INTEL=$(shasum -a 256 zosma-cowork-x64.dmg | cut -d ' ' -f 1)
              echo "intel_sha256=$SHA256_INTEL" >> "$GITHUB_OUTPUT"
              echo "Intel SHA256: $SHA256_INTEL"
            else
              echo "No Intel DMG found in release v${VERSION}"
            fi
          fi

      - name: Abort if no DMG found
        if: steps.dmg.outputs.arm_dmg == '' && steps.dmg.outputs.intel_dmg == ''
        run: |
          echo "No DMG assets found in release v${{ steps.version.outputs.value }}. Aborting."
          exit 1

      - name: Update Cask formula
        env:
          VERSION: ${{ steps.version.outputs.value }}
          ARM_DMG: ${{ steps.dmg.outputs.arm_dmg }}
          INTEL_DMG: ${{ steps.dmg.outputs.intel_dmg }}
          SHA256_ARM: ${{ steps.dmg.outputs.arm_sha256 }}
          SHA256_INTEL: ${{ steps.dmg.outputs.intel_sha256 }}
        run: |
          python3 .github/scripts/update-cask.py \
            "Casks/zosma-cowork.rb" \
            "$VERSION" \
            "$ARM_DMG" \
            "$INTEL_DMG" \
            "$SHA256_ARM" \
            "$SHA256_INTEL"

      - name: Commit and push
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zosma-cowork.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump zosma-cowork to ${VERSION}"
          git push
