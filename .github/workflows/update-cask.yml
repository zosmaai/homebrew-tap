name: Update Cask

on:
  schedule:
    # Check for new releases every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to update to (e.g., 0.8.0)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update-cask:
    name: Update Cask Formula
    runs-on: macos-14
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v4

      - name: Get latest release version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            # Fetch latest release tag from zosma-cowork (public repo, no token needed for public API)
            TAG=$(curl -sL "https://api.github.com/repos/zosmaai/zosma-cowork/releases/latest" | \
              python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('tag_name','').lstrip('v'))" 2>/dev/null || echo "")
            if [ -z "$TAG" ]; then
              echo "Failed to fetch latest release"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check current cask version
        id: current
        run: |
          CURRENT=$(grep -E "^  version" Casks/zosma-cowork.rb | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Current cask version: $CURRENT"

      - name: Skip if same version
        if: steps.latest.outputs.version == steps.current.outputs.version && github.event_name != 'workflow_dispatch'
        run: |
          echo "Cask is already at version ${{ steps.latest.outputs.version }}. Nothing to update."
          exit 0

      - name: Download and checksum ARM64 DMG
        id: sha-arm
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          curl -sL -o zosma-cowork-arm64.dmg \
            "https://github.com/zosmaai/zosma-cowork/releases/download/v${VERSION}/zosma-cowork_${VERSION}_aarch64.dmg"
          echo "sha256=$(shasum -a 256 zosma-cowork-arm64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Download and checksum Intel DMG
        id: sha-intel
        env:
          VERSION: ${{ steps.latest.outputs.version }}
        run: |
          curl -sL -o zosma-cowork-x64.dmg \
            "https://github.com/zosmaai/zosma-cowork/releases/download/v${VERSION}/zosma-cowork_${VERSION}_x64.dmg"
          echo "sha256=$(shasum -a 256 zosma-cowork-x64.dmg | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Update Cask formula
        env:
          VERSION: ${{ steps.latest.outputs.version }}
          SHA256_ARM: ${{ steps.sha-arm.outputs.sha256 }}
          SHA256_INTEL: ${{ steps.sha-intel.outputs.sha256 }}
        run: |
          CASK_FILE="Casks/zosma-cowork.rb"

          # Update version line
          sed -i '' "s/^  version \".*\"/  version \"${VERSION}\"/" "$CASK_FILE"

          # Update SHA256 lines (multi-arch format)
          sed -i '' "s/arm:.*/arm:   \"${SHA256_ARM}\",/" "$CASK_FILE"
          sed -i '' "s/intel:.*/intel: \"${SHA256_INTEL}\"/" "$CASK_FILE"

          echo "Updated Cask to version ${VERSION}"
          grep -E "version|sha256" "$CASK_FILE"

      - name: Commit and push
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/zosma-cowork.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "bump zosma-cowork to ${VERSION}"
          git push
